# nginx.conf — MT5 API reverse proxy
#
# Architecture:
#   Client  →  nginx :5000  →  Waitress :8000  →  Flask app
#
# Usage (nginx for Windows):
#   1. Download nginx/Windows from https://nginx.org/en/download.html
#   2. Extract to C:\nginx  (or any path)
#   3. Copy this file to C:\nginx\conf\nginx.conf  (or run install_service.bat)
#   4. Start:  C:\nginx\nginx.exe
#   5. Reload: C:\nginx\nginx.exe -s reload
#   6. Stop:   C:\nginx\nginx.exe -s quit

worker_processes auto;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log logs/access.log main;

    sendfile       on;
    keepalive_timeout 65;

    # Waitress backend
    upstream mt5api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen      80;
        server_name _;

        client_max_body_size 10M;

        location / {
            proxy_pass          http://mt5api;
            proxy_http_version  1.1;
            proxy_set_header    Connection          "";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;

            proxy_connect_timeout  10s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
        }
    }
}
