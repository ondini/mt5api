# nginx.conf — MT5 API reverse proxy
#
# Architecture:
#   Client  →  nginx :5000  →  Waitress :8000  →  Flask app
#
# Usage (nginx for Windows):
#   1. Download nginx/Windows from https://nginx.org/en/download.html
#   2. Extract to C:\nginx  (or any path)
#   3. Copy this file to C:\nginx\conf\nginx.conf  (or run install_service.bat)
#   4. Start:  C:\nginx\nginx.exe
#   5. Reload: C:\nginx\nginx.exe -s reload
#   6. Stop:   C:\nginx\nginx.exe -s quit

worker_processes auto;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log logs/access.log main;

    sendfile       on;
    keepalive_timeout 65;

    # --- Cloudflare real-IP resolution ---
    # Traffic arrives via Cloudflare, so $remote_addr is normally Cloudflare's
    # edge IP. These directives tell nginx to trust Cloudflare's edge ranges
    # and recover the real client IP from CF-Connecting-IP, so the allow/deny
    # IP allowlist below (and $remote_addr in logs) reflects the real caller.
    # Source: https://www.cloudflare.com/ips/ — re-check periodically, these
    # ranges change occasionally.
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;
    set_real_ip_from  2400:cb00::/32;
    set_real_ip_from  2606:4700::/32;
    set_real_ip_from  2803:f800::/32;
    set_real_ip_from  2405:b500::/32;
    set_real_ip_from  2405:8100::/32;
    set_real_ip_from  2a06:98c0::/29;
    set_real_ip_from  2c0f:f248::/29;

    # Waitress backend
    upstream mt5api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen      80;
        server_name _;

        client_max_body_size 10M;

        # Only these two callers may reach the API; everyone else gets 403.
        allow 178.104.147.116;
        allow 161.97.94.162;
        deny  all;

        location / {
            proxy_pass          http://mt5api;
            proxy_http_version  1.1;
            proxy_set_header    Connection          "";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;

            proxy_connect_timeout  10s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
        }
    }
}
